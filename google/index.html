<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엔에스대부중개 | 주택담보대출 실시간 한도조회</title>
<meta name="description" content="주택담보대출 - 아파트·빌라·오피스텔 담보, 후순위 가능, 낮은 금리 당일 심사. 3분 안심 한도조회.">
<meta name="robots" content="noai, noimageai">
<style>
:root{
  --paper:#faf5ee;
  --paper2:#f1e7db;
  --ink:#171410;
  --coral:#ff5636;
  --coral-d:#e5401f;
  --forest:#123a2e;
  --forest2:#0d2a20;
  --muted:#6f6656;
  --line:#e6ddce;
  --cream-line:rgba(255,255,255,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.hp{position:absolute!important;left:-9999px!important;top:-9999px!important;width:1px;height:1px;opacity:0;pointer-events:none}
.wrap{max-width:none;margin:0;background:transparent}
.in{max-width:1060px;margin:0 auto}
.s{padding:60px 22px}
.eyebrow{display:inline-block;font-weight:800;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--coral-d)}
.big{font-size:29px;font-weight:900;letter-spacing:-1.1px;line-height:1.12}
.lead{font-size:16px;color:var(--muted);margin-top:14px}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(250,245,238,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1060px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:-.5px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--coral);flex:0 0 auto}
.brand em{color:var(--coral-d);font-style:normal}
.brand .btx{display:flex;flex-direction:column;line-height:1.12}
.brand .btx b{font-size:16px;font-weight:900}
.brand .btx small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0}
.hright{display:flex;align-items:center;gap:16px}
.htel{font-weight:900;font-size:15px}
.hcta{display:none;background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;padding:11px 20px;border-radius:100px}

/* HERO — asymmetric editorial */
.hero{background:linear-gradient(180deg,rgba(250,245,238,.95) 0%,rgba(250,245,238,.62) 55%,rgba(250,245,238,.32) 100%),url('images/partner.jpg') center/cover no-repeat;padding:56px 22px 46px;position:relative;overflow:hidden}
.hero .in{position:relative;z-index:2}
.hero .eyebrow{margin-bottom:16px}
.hero h1{font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:-1.6px;line-height:1.05}
.hero h1 .cor{color:var(--coral)}
.hero h1 .out{-webkit-text-stroke:2px var(--ink);color:transparent}
.hero .sub{font-size:17px;color:var(--muted);margin-top:22px;max-width:440px}
.hero .acts{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero .acts a{font-weight:800;font-size:16px;padding:16px 28px;border-radius:100px}
.hero .acts .p{background:var(--coral);color:#fff;box-shadow:0 12px 26px rgba(255,86,54,.35)}
.hero .acts .g{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.hero .trust{display:flex;gap:22px;margin-top:30px;flex-wrap:wrap}
.hero .trust div b{font-size:26px;font-weight:900;letter-spacing:-1px}
.hero .trust div span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.hero .blob{position:absolute;right:-120px;top:-60px;width:360px;height:360px;background:radial-gradient(circle,rgba(255,86,54,.16),transparent 68%);border-radius:50%;z-index:0}
.hpic-wrap{position:relative;margin-top:34px}
.hpic-wrap::before{content:"";position:absolute;right:-16px;bottom:-16px;width:66%;height:72%;background:var(--coral);border-radius:26px;z-index:0}
.hpic{position:relative;z-index:1;border-radius:22px;overflow:hidden;aspect-ratio:4/3;background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:0 22px 48px rgba(0,0,0,.16);border:6px solid #fff}
.hp-chip{position:absolute;z-index:3;background:#fff;border-radius:100px;padding:9px 14px;font-weight:800;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.16);display:flex;align-items:center;gap:7px;top:16px;left:16px}
.hp-dot{width:9px;height:9px;border-radius:50%;background:#12c187;box-shadow:0 0 0 3px rgba(18,193,135,.2)}
.hp-card{position:absolute;z-index:3;right:12px;bottom:16px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.hp-card b{display:block;font-size:26px;font-weight:900;line-height:1;color:#fff}
.hp-card span{font-size:11px;color:#c9c1b3;font-weight:700}

/* FORM band (dark) */
.formband{background:var(--forest);color:#fff;padding:56px 22px}
.formband .in{display:grid;gap:28px}
.formband .fh .eyebrow{color:#7fe3b8}
.formband .fh h2{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.15;margin-top:12px}
.formband .fh p{color:#bcd9cd;margin-top:12px;font-size:15px}
.formband .fh ul{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:10px}
.formband .fh li{font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center}
.formband .fh li::before{content:"✓";color:var(--coral);font-weight:900}
.hform{background:var(--paper);border-radius:22px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);color:var(--ink)}
.hform label,.hform .ft{color:var(--ink)}
.hform .ft{font-size:19px;font-weight:900;text-align:center}
.hform .fs{font-size:13px;color:var(--muted);text-align:center;margin:5px 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.field label i{color:var(--coral-d);font-style:normal}
.field input,.field select{width:100%;border:1.6px solid var(--line);border-radius:13px;padding:14px 15px;font-size:15px;background:#fff;font-family:inherit;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--coral)}
.rrow{display:flex;gap:8px}
.rrow label{flex:1;border:1.6px solid var(--line);border-radius:13px;padding:12px 4px;text-align:center;font-size:13px;font-weight:800;cursor:pointer;background:#fff}
.rrow input{display:none}
.rrow label:has(input:checked){border-color:var(--coral);background:rgba(255,86,54,.08);color:var(--coral-d)}
.agree{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);margin:4px 0 14px;line-height:1.5}
.agree input{margin-top:3px;width:16px;height:16px;flex:0 0 16px}
.agree a{color:var(--coral-d);text-decoration:underline}
.cta{width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:900;color:#fff;background:var(--coral);cursor:pointer;font-family:inherit;box-shadow:0 12px 26px rgba(255,86,54,.35)}
.cta:active{transform:translateY(1px)}
.cta:disabled{opacity:.6}
.ffoot{text-align:center;font-size:12px;color:var(--muted);margin-top:11px}
.fwarn{text-align:center;font-size:12px;font-weight:800;color:var(--coral-d);margin-top:7px}

/* STAT band (coral) */
.statband{background:var(--coral);color:var(--ink);padding:40px 22px}
.statband .in{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.statband b{display:block;font-size:34px;font-weight:900;letter-spacing:-1.5px}
.statband span{font-size:12.5px;font-weight:800;color:rgba(23,20,16,.72)}

/* WHY — numbered editorial list */
.why{margin-top:20px}
.wln{display:flex;gap:22px;align-items:flex-start;padding:26px 0;border-top:1px solid var(--line)}
.wln:last-child{border-bottom:1px solid var(--line)}
.wln .no{font-size:30px;font-weight:900;color:var(--coral);letter-spacing:-1px;flex:0 0 58px;line-height:1}
.wln h4{font-size:21px;font-weight:900;letter-spacing:-.5px}
.wln p{font-size:15px;color:var(--muted);margin-top:6px;max-width:640px}

/* PRODUCTS — editorial list + one image on the right */
.pcols{margin-top:22px}
.pimg-one{margin-top:22px;border-radius:20px;aspect-ratio:4/3;background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:0 16px 34px rgba(0,0,0,.12);min-height:220px}
.plist{}

/* Mini form band (name + phone) */
.miniband{background:var(--coral);color:var(--ink);text-align:center;padding:52px 22px}
.miniband h3{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1.25}
.miniband p{margin-top:10px;font-size:15px;color:rgba(23,20,16,.8)}
.miniform{max-width:640px;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.miniform .mi{flex:1;min-width:150px;border:2px solid transparent;border-radius:12px;padding:15px 16px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
.miniform .mi:focus{outline:none;border-color:var(--ink)}
.miniform .mbtn{flex:0 0 auto;border:none;border-radius:12px;padding:15px 28px;font-size:16px;font-weight:900;background:var(--ink);color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 10px 22px rgba(0,0,0,.2)}
.miniform .mbtn:disabled{opacity:.6}
.magree{flex:0 0 100%;font-size:12px;color:rgba(23,20,16,.78);display:flex;gap:7px;align-items:center;justify-content:center;font-weight:700;margin-top:2px}
.magree input{width:15px;height:15px}
@media(min-width:900px){ .miniband h3{font-size:32px} }
.pln{display:flex;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.pln:last-child{border-bottom:1px solid var(--line)}
.pln .pno{font-size:14px;font-weight:900;color:var(--muted);flex:0 0 34px}
.pln .ptx{flex:1}
.pln .ptag{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--coral-d)}
.pln h4{font-size:19px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.pln p{font-size:13.5px;color:var(--muted);margin-top:3px}
.pln .pth{flex:0 0 96px;width:96px;height:72px;border-radius:12px;background:#ddd center/cover no-repeat;filter:grayscale(.15)}

/* PROCESS band (dark) */
.procband{background:var(--forest2);color:#fff;padding:60px 22px}
.procband .eyebrow{color:#7fe3b8}
.procband h2{font-size:30px;font-weight:900;letter-spacing:-1px}
.steps{margin-top:30px;display:flex;flex-direction:column;gap:0}
.stp{display:flex;gap:20px;align-items:flex-start;padding:22px 0;border-top:1px solid var(--cream-line)}
.stp:last-child{border-bottom:1px solid var(--cream-line)}
.stp .num{font-size:34px;font-weight:900;color:var(--coral);flex:0 0 54px;line-height:1}
.stp h4{font-size:19px;font-weight:900}
.stp p{font-size:14px;color:#bcd9cd;margin-top:4px}

/* RATE cards */
.rcards{display:grid;grid-template-columns:1fr;gap:14px;margin-top:24px}
.rcard{border:2px solid var(--ink);border-radius:18px;background:var(--paper);overflow:hidden}
.rcard .rh{background:var(--ink);color:var(--paper);padding:15px 20px;font-weight:900;font-size:17px}
.rcard .rd{font-size:12.5px;color:var(--muted);padding:12px 20px 0;line-height:1.5}
.rcard ul{list-style:none;padding:8px 20px 16px}
.rcard li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.rcard li:last-child{border-bottom:none}
.rcard li span{color:var(--muted)}
.rcard li b{color:var(--ink);font-weight:900}

/* LIVE ticker */
.live{margin-top:22px;border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--paper)}
.lhead{display:flex;align-items:center;gap:9px;padding:14px 18px;font-weight:900;background:var(--ink);color:var(--paper);font-size:14px}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,86,54,.5)}70%{box-shadow:0 0 0 9px rgba(255,86,54,0)}100%{box-shadow:0 0 0 0 rgba(255,86,54,0)}}
.live-list{}
.live-row{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr;gap:6px;padding:13px 16px;font-size:12.5px;align-items:center;border-top:1px solid var(--line)}
.live-row.head{background:var(--paper2);font-weight:800;color:var(--muted);font-size:11.5px;border-top:none}
.live-row .nm{font-weight:900}
.badge-ok{display:inline-block;background:rgba(18,58,46,.12);color:var(--forest);font-weight:800;font-size:11px;padding:3px 8px;border-radius:100px}
.badge-go{display:inline-block;background:rgba(255,86,54,.14);color:var(--coral-d);font-weight:800;font-size:11px;padding:3px 8px;border-radius:100px}
@keyframes rowIn{from{opacity:0;transform:translateY(-14px);background:rgba(255,86,54,.10)}to{opacity:1;transform:translateY(0);background:transparent}}
.live-row.isnew{animation:rowIn .6s ease}
.lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink)}
.lstats div{padding:14px 8px;text-align:center;border-right:1px solid var(--line)}
.lstats div:last-child{border-right:none}
.lstats b{display:block;font-size:17px;font-weight:900}
.lstats span{font-size:11px;color:var(--muted);font-weight:700}

/* FAQ */
.faq{margin-top:22px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:20px 4px;font-weight:900;font-size:16px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--coral);font-size:24px;font-weight:900;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .fa{padding:0 4px 20px;color:var(--muted);font-size:14px;line-height:1.7}

/* BAND cta */
.cband{background:var(--coral);color:var(--ink);text-align:center;padding:56px 22px}
.cband h3{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.2}
.cband p{margin-top:12px;font-size:15px;color:rgba(23,20,16,.8)}
.cband a{display:inline-block;margin-top:24px;background:var(--ink);color:#fff;font-weight:900;padding:16px 34px;border-radius:100px;font-size:16px}

/* 필수표시·경고 밴드 (대부업 광고 심의 기준) */
.legalband{background:var(--paper2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 22px}
.legalband .in{max-width:1060px;margin:0 auto}
.legalband .lwarn{font-size:17px;font-weight:800;color:var(--ink);background:#fff;border:2px solid var(--coral);border-radius:12px;padding:15px 16px;line-height:1.5}
.legalband .lco{margin-top:16px;font-size:16px;font-weight:800;color:var(--ink)}
.legalband .reqs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.legalband .reqs li{font-size:16px;font-weight:700;color:var(--ink);line-height:1.5}
.legalband .lex{margin-top:14px;font-size:14px;color:var(--muted);font-weight:600;line-height:1.55}
@media(min-width:900px){ .legalband{padding:36px 40px} .legalband .reqs{grid-template-columns:1fr 1fr;gap:8px 34px} }

/* FOOTER */
footer{background:var(--ink);color:#b3ab9d;padding:40px 22px 120px;font-size:14px;line-height:1.7}
footer .fin{max-width:1060px;margin:0 auto}
footer .fl{color:#fff;font-weight:900;font-size:17px;margin-bottom:14px}
footer .biz{border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);padding:14px 0;margin:12px 0}
footer .biz b{color:#d8cfbf}
footer .warn{color:#f0c3b6;font-size:15px;font-weight:700;margin-top:12px;background:rgba(255,86,54,.12);border:1px solid rgba(255,86,54,.3);border-radius:10px;padding:14px 16px;line-height:1.6}
footer .legal{margin-top:12px;font-size:11px;color:#77705f}
footer .lwarn{font-size:17px;font-weight:800;color:#fff;background:rgba(255,255,255,.06);border:2px solid var(--coral);border-radius:12px;padding:15px 16px;line-height:1.5;margin:14px 0}
footer .lco{font-size:16px;font-weight:800;color:#fff;margin-bottom:8px}
footer .reqs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer .reqs li{font-size:16px;font-weight:600;color:#d8cfbf;line-height:1.5}
footer .lex{margin-top:14px;font-size:14px;color:#b3ab9d;line-height:1.55}
@media(min-width:900px){ footer .reqs{grid-template-columns:1fr 1fr;gap:8px 34px} }

/* Sticky (mobile) */
.sticky{position:fixed;left:0;bottom:0;width:100%;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;z-index:60}
.sticky a{flex:1;text-align:center;border-radius:100px;padding:15px;font-weight:900;font-size:15px}
.sticky .call{background:var(--paper2);color:var(--ink)}
.sticky .apply{background:var(--coral);color:#fff}

/* ===== Desktop ===== */
@media(min-width:900px){
  .s{padding:96px 40px}
  .hcta{display:inline-block}
  .big{font-size:40px}
  .hero{padding:120px 40px 104px;background:linear-gradient(100deg,var(--paper) 0%,rgba(250,245,238,.93) 40%,rgba(250,245,238,.5) 66%,rgba(250,245,238,.12) 100%),url('images/partner.jpg') center right/cover no-repeat}
  .hero .in{display:block}
  .hero .hcopy{max-width:640px}
  .hero .sub{font-size:19px}
  .formband{padding:90px 40px}
  .formband .in{grid-template-columns:1fr 1fr;gap:56px;align-items:center}
  .formband .fh h2{font-size:42px}
  .hform{max-width:460px;margin-left:auto;padding:30px 28px}
  .statband{padding:56px 40px}
  .statband b{font-size:40px}
  .why,.faq{max-width:1000px;margin-left:auto;margin-right:auto}
  .pcols{max-width:1060px;margin:24px auto 0;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:stretch}
  .pimg-one{margin-top:0;aspect-ratio:auto;height:100%;min-height:400px}
  .wln .no{font-size:40px;flex:0 0 80px}
  .wln h4{font-size:26px}
  .steps{max-width:1000px;margin:34px auto 0}
  .rcards{grid-template-columns:repeat(3,1fr);gap:18px;max-width:1060px;margin:28px auto 0}
  .live{max-width:1060px;margin:24px auto 0}
  .procband h2{font-size:40px}
  .cband h3{font-size:42px}
  .sticky{display:none}
  footer{padding:56px 40px}
}

</style>
</head>
<body>
<div id="app"></div>
<noscript style="display:block;padding:40px;text-align:center;font-family:sans-serif">
  본 페이지는 자바스크립트 환경에서 정상적으로 표시됩니다. 브라우저의 자바스크립트를 켜주세요.
</noscript>
<script>

// ▼▼ 구글 Apps Script 웹앱 배포 후 나온 주소를 여기에 붙여넣으세요 ▼▼
const GAS_URL = "https://script.google.com/macros/s/AKfycbzGJADjQF3KEOunwLvTIk24OU9SwoeKz0JgAJ_OZGP-TI2CUltyUH0o6hLs-fL6a9Et3Q/exec";

// 실시간 신청현황 더미 데이터 (주택담보대출)
const surnames = ["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","전","홍"];
const conds = ["아파트 담보","빌라 담보","오피스텔 담보","직장인 신용대출","사업자 담보","후순위 담보","신용대출","대환 상담"];
const amounts = ["5,000만원","8,000만원","1억원","1.5억원","2억원","3억원"];
const states = [["승인완료","badge-ok"],["진행중","badge-go"],["조회완료","badge-ok"]];
function rand(a){return a[Math.floor(Math.random()*a.length)]}

let REAL_ROWS = [];  // 구글시트에서 불러온 실제 신청내역(마스킹된 상태)
function dummyRow(){
  return {
    nm: rand(surnames)+"*"+(Math.random()<.5?"*":rand(surnames)),
    type: rand(conds),
    amount: rand(amounts),
    st: rand(states)
  };
}
function pickRow(){
  if(REAL_ROWS.length && Math.random()<0.6){
    const r=REAL_ROWS[Math.floor(Math.random()*REAL_ROWS.length)];
    return { nm:r.nm, type:r.type||rand(conds), amount:r.amount||rand(amounts), st: rand(states) };
  }
  return dummyRow();
}
function rowHTML(rec,isNew){
  return `<div class="live-row${isNew?' isnew':''}">
    <div class="nm">${rec.nm}</div>
    <div>${rec.type}</div>
    <div>${rec.amount}</div>
    <div><span class="${rec.st[1]}">${rec.st[0]}</span></div>
  </div>`;
}
function buildRows(n){
  const box=document.getElementById("liveList");
  if(!box) return;
  let html="";
  for(let i=0;i<n;i++) html+=rowHTML(pickRow(),false);
  box.insertAdjacentHTML("beforeend",html);
}
// 실시간처럼 새 신청내역이 위에서 내려오며 아래로 슬라이딩
function addLiveRow(){
  const box=document.getElementById("liveList");
  if(!box) return;
  const head=box.querySelector(".live-row.head");
  if(!head) return;
  head.insertAdjacentHTML("afterend", rowHTML(pickRow(),true));
  const rows=box.querySelectorAll(".live-row:not(.head)");
  if(rows.length>8) rows[rows.length-1].remove();
}
function startLiveFeed(){
  const tick=function(){
    addLiveRow();
    setTimeout(tick, 2000+Math.random()*2600);
  };
  setTimeout(tick, 1800);
}
// 구글시트의 실제 신청내역(이름 마스킹)을 JSONP로 불러오기 (CORS 우회)
function loadRealRows(){
  if(!GAS_URL || GAS_URL.indexOf("http")!==0) return;
  const cb="__nsLive_"+Math.floor(Math.random()*1e9);
  window[cb]=function(rows){
    if(Array.isArray(rows) && rows.length) REAL_ROWS=rows;
    try{ delete window[cb]; }catch(e){}
  };
  const s=document.createElement("script");
  s.src=GAS_URL+"?list=1&callback="+cb;
  s.onerror=function(){ try{ delete window[cb]; }catch(e){} };
  document.head.appendChild(s);
}

const PAGE_LOADED_AT = Date.now();
function normPhone(v){ return (v||"").replace(/[^0-9]/g,""); }

async function submitForm(e){
  e.preventDefault();
  const f=e.target;

  // 스팸 방어 1: 허니팟(사람에겐 안 보이는 칸)이 채워졌으면 봇 → 조용히 성공처럼 종료
  if((f.website && f.website.value) || (f.homepage && f.homepage.value)){
    alert("한도조회 신청이 접수되었습니다.\n전문 상담원이 곧 연락드리겠습니다. 감사합니다!");
    f.reset(); return false;
  }
  // 스팸 방어 2: 페이지 로드 후 3초 이내 제출은 봇으로 간주
  if(Date.now() - PAGE_LOADED_AT < 3000){
    alert("입력을 조금만 더 확인한 뒤 다시 시도해주세요.");
    return false;
  }
  if(!f.agree.checked){alert("개인정보 수집·이용에 동의해주세요.");return false;}

  // 스팸 방어 3: 휴대폰 번호 형식 검증 (010/011… 10~11자리)
  const phone = normPhone(f.phone.value);
  if(!/^01[0-9]{8,9}$/.test(phone)){
    alert("휴대폰 번호를 정확히 입력해주세요. (예: 01012345678)");
    return false;
  }

  const btn=f.querySelector("button[type=submit]");
  const orig=btn.textContent;
  btn.disabled=true; btn.textContent="접수 중...";

  const data={
    name:f.name.value.trim(),
    phone:phone,
    property:(f.property && f.property.value)||"",
    amount:(f.amount && f.amount.value)||"",
    job:(f.job && f.job.value)||"",
    income:(f.income && f.income.value)||"",
    website:(f.website && f.website.value)||"",
    elapsed:Date.now()-PAGE_LOADED_AT,
    page:location.href,
    ua:navigator.userAgent
  };

  try{
    if(GAS_URL.startsWith("http")){
      await fetch(GAS_URL,{
        method:"POST",
        mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(data)
      });
    }
    alert("한도조회 신청이 접수되었습니다.\n전문 상담원이 곧 연락드리겠습니다. 감사합니다!");
    f.reset();
  }catch(err){
    alert("일시적인 오류가 발생했습니다. 전화(0000-0000)로 문의해주세요.");
  }finally{
    btn.disabled=false; btn.textContent=orig;
  }
  return false;
}

loadRealRows();
buildRows(8);
startLiveFeed();

// 수치 카운트업: .countup 요소가 화면에 들어오면 0 -> 목표값으로 상승
function animateCount(el){
  var raw = el.getAttribute("data-cv") || el.textContent;
  el.setAttribute("data-cv", raw);
  var m = raw.match(/[\d,]+(\.\d+)?/);
  if(!m) return;
  var numStr = m[0];
  var target = parseFloat(numStr.replace(/,/g,""));
  if(isNaN(target)) return;
  var decimals = numStr.indexOf(".")>=0 ? numStr.split(".")[1].length : 0;
  var hasComma = numStr.indexOf(",")>=0;
  var prefix = raw.slice(0, m.index);
  var suffix = raw.slice(m.index + numStr.length);
  function fmt(v){
    var s = v.toFixed(decimals);
    if(hasComma){ var p=s.split("."); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,","); s=p.join("."); }
    return prefix + s + suffix;
  }
  var dur=1300, startT=null;
  function step(ts){
    if(startT===null) startT=ts;
    var pr=Math.min((ts-startT)/dur,1);
    var e=1-Math.pow(1-pr,3);
    el.textContent=fmt(target*e);
    if(pr<1) requestAnimationFrame(step); else el.textContent=fmt(target);
  }
  el.textContent=fmt(0);
  requestAnimationFrame(step);
}
function initCountup(){
  var els=document.querySelectorAll(".countup");
  if(!els.length) return;
  if(!("IntersectionObserver" in window)){ for(var i=0;i<els.length;i++) animateCount(els[i]); return; }
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ animateCount(en.target); io.unobserve(en.target); } });
  },{threshold:.4});
  els.forEach(function(el){ io.observe(el); });
}
initCountup();
