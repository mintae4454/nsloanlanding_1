<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엔에스대부중개 | 주택담보대출 실시간 한도조회</title>
<meta name="description" content="주택담보대출 - 아파트·빌라·오피스텔 담보, 후순위 가능, 낮은 금리 당일 심사. 3분 안심 한도조회.">
<meta name="robots" content="noai, noimageai">
<style>
:root{
  --navy:#0f2a5c;
  --blue:#1a5fd0;
  --blue-light:#3d82ff;
  --accent:#00c389;
  --bg:#f4f7fb;
  --ink:#1a2233;
  --muted:#6b7690;
  --line:#e4e9f2;
  --white:#ffffff;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,42,92,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;background:var(--white);min-height:100vh;position:relative;box-shadow:0 0 40px rgba(0,0,0,.05)}
.inner{max-width:520px;margin:0 auto}
.sec{padding:44px 22px}
.center{text-align:center}
.tag{display:inline-block;background:rgba(26,95,208,.1);color:var(--blue);font-weight:700;font-size:13px;padding:6px 14px;border-radius:100px;margin-bottom:14px}
h2.title{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.35}
h2.title .pt{color:var(--blue)}
.sub{color:var(--muted);font-size:15px;margin-top:10px}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;max-width:1120px;margin:0 auto}
.hright{display:flex;align-items:center;gap:14px}
.htel{font-weight:800;color:var(--blue);font-size:15px}
.hbtn{display:none;background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border-radius:100px}

/* Brand logo */
.brand{display:flex;align-items:center;gap:11px}
.brand .mk{position:relative;width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,#12327a 0%,#1a5fd0 55%,#00c389 130%);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(26,95,208,.35);overflow:hidden}
.brand .mk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.45),transparent 55%)}
.brand .mk svg{position:relative;z-index:2}
.brand .mk .mono{position:absolute;right:5px;bottom:3px;z-index:2;color:#fff;font-size:9px;font-weight:900;letter-spacing:.5px;opacity:.95}
.brand .tx{display:flex;flex-direction:column;line-height:1.12}
.brand .tx b{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
.brand .tx b em{color:var(--blue);font-style:normal}
.brand .tx small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin-top:1px}

/* Hero */
.hero{background:linear-gradient(160deg,rgba(15,42,92,.92),rgba(26,95,208,.80)),url('images/hero.jpg') center/cover no-repeat;color:#fff;padding:40px 22px 120px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(0,195,137,.35),transparent 70%);border-radius:50%}
.hero-grid{max-width:1120px;margin:0 auto;position:relative;z-index:2}
.hero .tag{background:rgba(255,255,255,.15);color:#dbe7ff}
.hero h1{font-size:30px;font-weight:800;line-height:1.3;letter-spacing:-1px}
.hero h1 .hl{color:var(--accent)}
.hero .lead{margin-top:14px;color:#cfe0ff;font-size:16px}
.hero .badges{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.hero .badges span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:100px;font-size:13px;font-weight:600}

/* Form card (shared) */
.form-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 20px;box-shadow:var(--shadow);color:#1a2233}
.form-card label{color:#1a2233}
.form-card .fc-title{font-size:18px;font-weight:800;color:#12327a;margin-bottom:4px}
.form-card .fc-sub{font-size:13px;color:#6b7690;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field label .req{color:#e5484d}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;font-size:15px;background:#fbfcfe;font-family:inherit;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);background:#fff}
.radio-row{display:flex;gap:8px}
.radio-row label{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:#fbfcfe;transition:.15s}
.radio-row input{display:none}
.radio-row label:has(input:checked){border-color:var(--blue);background:rgba(26,95,208,.06);color:var(--blue)}
.agree{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--muted);margin:6px 0 16px;line-height:1.5}
.agree input{margin-top:3px;width:16px;height:16px;flex:0 0 16px}
.agree a{color:var(--blue);text-decoration:underline}
.btn{width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-light));cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(26,95,208,.3);transition:.15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default}
.btn.green{background:linear-gradient(135deg,#00b57e,var(--accent));box-shadow:0 8px 20px rgba(0,195,137,.3)}
.form-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
.hp{position:absolute!important;left:-9999px!important;top:-9999px!important;width:1px;height:1px;opacity:0;pointer-events:none;z-index:-1}
.form-warn{text-align:center;font-size:12px;font-weight:700;color:#e5484d;margin-top:7px;line-height:1.4}

/* KPI */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-90px 22px 0;position:relative;z-index:5;max-width:1120px}
.kpi.desktoppad{margin-left:auto;margin-right:auto}
.kpi .card{background:#fff;border-radius:var(--radius);padding:18px 10px;text-align:center;box-shadow:var(--shadow)}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-num{font-size:20px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.5px}
.kpi .k-num small{font-size:12px;font-weight:700}
.kpi .k-unit{font-size:12px;color:var(--blue);font-weight:700;margin-top:2px}

/* Why-us trust stats */
.whystats{display:flex;gap:10px;margin-top:22px}
.whystats .ws{flex:1;background:linear-gradient(180deg,#f7faff,#eef4fd);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center}
.whystats .ws b{display:block;font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.whystats .ws span{font-size:11.5px;color:var(--muted);font-weight:700}
@media (min-width:900px){ .whystats{max-width:760px;margin-left:auto;margin-right:auto} .whystats .ws b{font-size:26px} }

/* Reasons */
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.reason{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.reason .ico{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--blue-light));display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px}
.reason h4{font-size:16px;font-weight:700}
.reason p{font-size:13px;color:var(--muted);margin-top:4px}

/* Products */
.prods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.prod{border:1px solid var(--line);border-radius:14px;padding:18px 16px;background:#fff}
.prod .pico{font-size:24px;margin-bottom:8px}
.prod h4{font-size:15px;font-weight:700}
.prod p{font-size:12.5px;color:var(--muted);margin-top:3px}

/* Feature rows (Why Us / For You) */
.feats{margin-top:26px;display:grid;grid-template-columns:1fr;gap:0}
.feat{display:flex;gap:16px;padding:20px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.feat:last-child{border-bottom:none}
.feat .fic{flex:0 0 52px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--accent));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 18px rgba(26,95,208,.25)}
.feat .ft{flex:1}
.feat .ft h4{font-size:17px;font-weight:800;margin-bottom:4px}
.feat .ft h4 em{color:var(--blue);font-style:normal}
.feat .ft p{font-size:14px;color:var(--muted);line-height:1.6}
@media(min-width:900px){ .feat{padding:20px 0} }

/* Why-us 2-column with visual panel */
.why-wrap{margin-top:24px}
.why-visual{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,rgba(15,42,92,.32),rgba(26,95,208,.18)),url('images/house.jpg') center/cover no-repeat;min-height:280px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(15,42,92,.20);margin-bottom:24px}
.why-visual::after{content:"";position:absolute;right:-40px;top:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,195,137,.35),transparent 70%);border-radius:50%}
.why-visual .wv-house{width:56%;max-width:230px;position:relative;z-index:2}
.why-visual .wv-chip{position:absolute;z-index:3;background:#fff;border-radius:14px;padding:9px 13px;box-shadow:0 10px 24px rgba(0,0,0,.18);font-weight:800;color:var(--navy);font-size:12.5px;display:flex;align-items:center;gap:9px;line-height:1.2}
.why-visual .wv-chip small{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:1px}
.why-visual .wv-chip .em{font-size:18px}
.why-visual .wv-chip.c1{top:20px;left:20px}
.why-visual .wv-chip.c2{bottom:22px;right:20px}
.why-right .whystats{margin:0 0 6px;max-width:none}
@media(min-width:900px){
  .why-wrap{max-width:1100px;margin:28px auto 0;display:grid;grid-template-columns:.82fr 1.18fr;gap:46px;align-items:stretch}
  .why-visual{margin-bottom:0;min-height:360px;height:100%}
}

/* Horizontal snap products */
.pscroll{margin-top:24px;display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;-webkit-overflow-scrolling:touch}
.pscroll::-webkit-scrollbar{height:6px}
.pscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
.pcard{scroll-snap-align:start;border:1px solid var(--line);border-radius:18px;padding:0 0 20px;background:#fff;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(15,42,92,.05)}
.pcard .pimg{height:120px;background-color:#0f2a5c;background-size:cover;background-position:center;background-repeat:no-repeat;position:relative}
.pcard .pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,42,92,0),rgba(15,42,92,.30))}
.pcard .pbody{padding:16px 20px 0}
.pcard .pt2{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.6px}
.pcard h4{font-size:19px;font-weight:800;margin:6px 0}
.pcard p{font-size:13.5px;color:var(--muted);line-height:1.6}
.pcard .pmeta{margin-top:14px;display:flex;gap:7px;flex-wrap:wrap}
.pcard .pmeta span{font-size:11.5px;font-weight:700;color:var(--navy);background:var(--bg);border:1px solid var(--line);padding:5px 11px;border-radius:100px}
@media(min-width:900px){ .pscroll{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);grid-auto-columns:auto;overflow:visible;gap:18px;max-width:1120px;margin-left:auto;margin-right:auto} }

/* Stepper (Process) */
.steps2{margin-top:28px;display:flex;flex-direction:column;gap:22px}
.st2{display:flex;gap:16px;align-items:flex-start}
.st2 .st2n{position:relative;flex:0 0 56px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 18px rgba(26,95,208,.25)}
.st2 .st2n b{position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.st2 .st2t h4{font-size:17px;font-weight:800;margin-bottom:3px}
.st2 .st2t p{font-size:14px;color:var(--muted);line-height:1.6}
@media(min-width:900px){
  .steps2{flex-direction:row;max-width:1080px;margin:36px auto 0;gap:0}
  .st2{flex:1;flex-direction:column;align-items:center;text-align:center;padding:0 16px;position:relative}
  .st2:not(:last-child)::after{content:"";position:absolute;top:28px;left:50%;width:100%;height:2px;background:repeating-linear-gradient(90deg,rgba(26,95,208,.35) 0 7px,transparent 7px 14px);z-index:0}
  .st2 .st2n{z-index:1;margin-bottom:16px}
  .st2 .st2t p{max-width:210px}
}

/* For You checklist panel */
.persona{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--shadow)}
.pitem{display:flex;gap:14px;align-items:center;padding:16px 14px;border-radius:14px;transition:background .15s}
.pitem:hover{background:#f5f9ff}
.picon{flex:0 0 48px;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px}
.picon.i1{background:rgba(233,72,77,.10)}
.picon.i2{background:rgba(26,95,208,.10)}
.picon.i3{background:rgba(139,107,255,.13)}
.picon.i4{background:rgba(0,195,137,.13)}
.ptxt{flex:1;min-width:0}
.pitem h4{font-size:16px;font-weight:800}
.pitem p{font-size:13px;color:var(--muted);margin-top:2px}
.pitem .pgo{flex:0 0 auto;color:var(--blue);font-size:22px;font-weight:800;opacity:.4}
@media(min-width:900px){
  .persona{max-width:1000px;margin:26px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;padding:16px}
}

/* For You : left list + right quick form */
.foryou-wrap{margin-top:24px}
.fy-form{margin-top:16px}
@media(min-width:900px){
  .foryou-wrap{max-width:1080px;margin:26px auto 0;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:stretch}
  .foryou-wrap .persona{margin:0;max-width:none;display:flex;flex-direction:column;justify-content:space-between}
  .foryou-wrap .fy-form{margin-top:0}
}

/* Documents image + checklist */
.docs{margin-top:24px}
.doc-visual{border-radius:20px;overflow:hidden;min-height:200px;background:linear-gradient(150deg,rgba(15,42,92,.28),rgba(26,95,208,.10)),url('images/docs.jpg') center/cover no-repeat;box-shadow:0 14px 30px rgba(15,42,92,.15);margin-bottom:20px}
.doc-list{display:flex;flex-direction:column;gap:12px}
.doc-row{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px}
.doc-row .di{flex:0 0 42px;width:42px;height:42px;border-radius:11px;background:rgba(26,95,208,.1);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px}
.doc-row h4{font-size:15px;font-weight:800}
.doc-row p{font-size:13px;color:var(--muted);margin-top:2px}
@media(min-width:900px){
  .docs{max-width:1080px;margin:26px auto 0;display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:stretch}
  .doc-visual{margin-bottom:0;min-height:100%}
}

/* Timeline (Process) */
.tl{margin-top:28px;position:relative}
.tl::before{content:"";position:absolute;left:22px;top:10px;bottom:20px;width:2px;background:linear-gradient(var(--blue),var(--accent))}
.tlrow{position:relative;display:flex;gap:18px;padding-bottom:26px}
.tlrow:last-child{padding-bottom:0}
.tlnode{flex:0 0 46px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2;font-size:16px;box-shadow:0 6px 14px rgba(26,95,208,.25)}
.tltxt{padding-top:3px}
.tltxt h4{font-size:17px;font-weight:800;margin-bottom:4px}
.tltxt p{font-size:14px;color:var(--muted);line-height:1.6}
@media(min-width:900px){ .tl{max-width:720px;margin-left:auto;margin-right:auto} }

/* Full-width emphasis CTA band */
.ctaband{background:linear-gradient(135deg,#0f2a5c,#1a5fd0);color:#fff;text-align:center;padding:48px 22px;position:relative;overflow:hidden}
.ctaband::after{content:"";position:absolute;right:-40px;bottom:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,195,137,.35),transparent 70%);border-radius:50%}
.ctaband > *{position:relative;z-index:2;max-width:760px;margin-left:auto;margin-right:auto}
.ctaband h3{font-size:24px;font-weight:800;line-height:1.35}
.ctaband h3 em{color:var(--accent);font-style:normal}
.ctaband p{color:#cfe0ff;margin-top:10px;font-size:15px}
.ctaband a{display:inline-block;margin-top:22px;background:#fff;color:var(--navy);font-weight:800;padding:15px 34px;border-radius:100px;font-size:16px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
@media(min-width:900px){ .ctaband{padding:64px 40px} .ctaband h3{font-size:34px} }

/* Hero skyline silhouette */
.hero-skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:1;pointer-events:none;display:block}

/* Soft dotted texture sections */
.soft{background-color:#f6f9ff;background-image:radial-gradient(rgba(26,95,208,.07) 1px,transparent 1.5px);background-size:22px 22px}
.whyus{background:radial-gradient(rgba(26,95,208,.10) 1px,transparent 1.5px) 0 0/22px 22px, linear-gradient(180deg,#e7eef9,#f2f7fd)}
.qual{position:relative;overflow:hidden}
.qual-skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:0;pointer-events:none;opacity:.7}
.qual .center,.qual .qlist,.qual .qnote{position:relative;z-index:2}

/* Process */
.steps{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.step .n{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.step h4{font-size:16px;font-weight:700}
.step p{font-size:13px;color:var(--muted)}

/* Qualify */
.qual{background:var(--navy);color:#fff}
.qual .tag{background:rgba(255,255,255,.15);color:#dbe7ff}
.qual h2.title{color:#fff}
.qlist{margin-top:22px;display:grid;grid-template-columns:1fr;gap:10px}
.qitem{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px}
.qitem .qi{font-size:20px}
.qitem .qt{font-size:13px;color:#a9c0e8;font-weight:600}
.qitem .qv{font-size:15px;font-weight:700;margin-top:1px}
.qnote{margin-top:16px;font-size:12.5px;color:#9fb2d4;background:rgba(255,255,255,.06);border-radius:10px;padding:12px 14px}

.form-sec{background:linear-gradient(180deg,#eef3fb,#fff)}

/* Apply section 2-column */
.apply-benefits{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:11px}
.apply-benefits li{display:flex;gap:11px;align-items:center;font-size:15px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;box-shadow:0 4px 12px rgba(15,42,92,.04)}
.apply-benefits li span{font-size:19px;flex:0 0 auto}
.apply-call{margin-top:20px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:15px 20px}
.apply-call .ac-ic{font-size:26px}
.apply-call small{display:block;font-size:12px;color:#cfe0ff;font-weight:700}
.apply-call b{font-size:22px;font-weight:800;letter-spacing:.5px}
.apply-left{margin-bottom:26px}
@media(min-width:900px){
  .apply-wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .apply-left{margin-bottom:0}
}

/* FAQ */
.faq{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.faq details{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;font-size:15px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--blue);font-size:22px;font-weight:800;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .fa{padding:0 18px 16px;color:var(--muted);font-size:14px;line-height:1.7}
@media (min-width:900px){ .faq{max-width:820px;margin-left:auto;margin-right:auto} }

/* Live status */
.live-head{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(0,195,137,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,195,137,.5)}70%{box-shadow:0 0 0 10px rgba(0,195,137,0)}100%{box-shadow:0 0 0 0 rgba(0,195,137,0)}}
.live-list{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
@keyframes rowIn{from{opacity:0;transform:translateY(-16px);background:rgba(0,195,137,.10)}to{opacity:1;transform:translateY(0);background:transparent}}
.live-row.isnew{animation:rowIn .6s ease}
.live-row{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr;gap:6px;padding:12px 14px;font-size:12.5px;align-items:center;border-bottom:1px solid var(--line)}
.live-row:last-child{border-bottom:none}
.live-row.head{background:var(--bg);font-weight:700;color:var(--muted);font-size:11.5px}
.live-row .nm{font-weight:700}
.badge-ok{display:inline-block;background:rgba(0,195,137,.12);color:#00996a;font-weight:700;font-size:11px;padding:3px 8px;border-radius:100px}
.badge-go{display:inline-block;background:rgba(26,95,208,.1);color:var(--blue);font-weight:700;font-size:11px;padding:3px 8px;border-radius:100px}

/* Rate cards (상환방식별) */
.ratecards{margin-top:24px;display:grid;grid-template-columns:1fr;gap:14px}
.ratecard{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(15,42,92,.05)}
.ratecard .rc-head{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:15px 20px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.ratecard .rc-head .rc-ic{font-size:20px}
.ratecard .rc-desc{font-size:12.5px;color:var(--muted);padding:12px 20px 0;line-height:1.5}
.ratecard ul{list-style:none;margin:0;padding:8px 20px 16px}
.ratecard li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.ratecard li:last-child{border-bottom:none}
.ratecard li span{color:var(--muted)}
.ratecard li b{color:var(--navy);font-weight:800}
@media(min-width:900px){ .ratecards{grid-template-columns:repeat(3,1fr);gap:18px;max-width:1080px;margin-left:auto;margin-right:auto} }

/* Rate box */
.rates{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:22px}
.rates .r{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.rates .r:last-child{border-bottom:none}
.rates .r .rl{color:var(--muted)}
.rates .r .rv{font-weight:700;color:var(--navy)}

/* 필수표시·경고 밴드 (대부업 광고 심의 기준) */
.legalband{background:#eef3fb;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 22px}
.legalband .in{max-width:1120px;margin:0 auto}
.legalband .lwarn{font-size:17px;font-weight:800;color:#111;background:#fff;border:2px solid #e5484d;border-radius:12px;padding:15px 16px;line-height:1.5}
.legalband .lco{margin-top:16px;font-size:16px;font-weight:800;color:var(--navy)}
.legalband .reqs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.legalband .reqs li{font-size:16px;font-weight:700;color:var(--ink);line-height:1.5}
.legalband .lex{margin-top:14px;font-size:14px;color:var(--muted);font-weight:600;line-height:1.55}
@media(min-width:900px){ .legalband{padding:34px 40px} .legalband .reqs{grid-template-columns:1fr 1fr;gap:8px 34px} }

/* Footer */
footer{background:#0b1a3a;color:#9fb2d4;padding:34px 22px 120px;font-size:14px;line-height:1.7}
footer .finner{max-width:1120px;margin:0 auto}
footer .flogo{color:#fff;font-weight:800;font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
footer .flogo .fmk{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#12327a,#1a5fd0 55%,#00c389 130%);display:flex;align-items:center;justify-content:center}
footer .biz{border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);padding:14px 0;margin:12px 0}
footer .biz b{color:#c9d6ee}
footer .warn{color:#e6b3b3;font-size:15px;font-weight:700;margin-top:12px;background:rgba(233,72,77,.1);border:1px solid rgba(233,72,77,.3);border-radius:10px;padding:14px 16px;line-height:1.6}
footer .legal{margin-top:12px;font-size:11px;color:#6f83a8}
footer .lwarn{font-size:17px;font-weight:800;color:#fff;background:rgba(255,255,255,.06);border:2px solid #e5484d;border-radius:12px;padding:15px 16px;line-height:1.5;margin:14px 0}
footer .lco{font-size:16px;font-weight:800;color:#fff;margin-bottom:8px}
footer .reqs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer .reqs li{font-size:16px;font-weight:600;color:#cdd8ee;line-height:1.5}
footer .lex{margin-top:14px;font-size:14px;color:#9fb2d4;line-height:1.55}
@media(min-width:900px){ footer .reqs{grid-template-columns:1fr 1fr;gap:8px 34px} }

/* Sticky CTA (mobile only) */
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;z-index:60;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.sticky a{flex:1;text-align:center;border-radius:12px;padding:15px;font-weight:800;font-size:15px}
.sticky .call{background:var(--bg);color:var(--navy);border:1.5px solid var(--line)}
.sticky .apply{background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff}

.divider{height:8px;background:var(--bg)}
.hero-form{display:none}

/* ============ DESKTOP ============ */
@media (min-width:900px){
  .wrap{max-width:none;box-shadow:none;background:var(--bg)}
  .inner{max-width:1120px}
  .sec{padding:70px 40px}
  .hbtn{display:inline-block}
  h2.title{font-size:32px}
  .sub{font-size:16px}

  .hero{padding:70px 40px 70px}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  .hero h1{font-size:44px}
  .hero .lead{font-size:18px;margin-top:18px}
  .hero-form{display:block}

  .kpi{margin:-46px auto 0;grid-template-columns:repeat(3,1fr);gap:18px;padding:0 40px;max-width:1120px}
  .kpi .k-num{font-size:26px}

  .reasons{grid-template-columns:repeat(4,1fr);gap:18px}
  .prods{grid-template-columns:repeat(4,1fr);gap:18px}
  .steps{flex-direction:row;gap:16px}
  .step{flex:1;flex-direction:column;align-items:flex-start;gap:10px}
  .qlist{grid-template-columns:repeat(2,1fr);gap:14px}
  .live-row{font-size:14px;padding:15px 20px}

  .sticky{display:none}

  footer{padding:44px 40px}
}
@media (min-width:900px){
  .sec .center{max-width:720px;margin:0 auto}
  .sec > .reasons,.sec > .prods,.sec > .steps,.sec > .qlist,.sec > .live-list,.sec > .rates,.sec > .qnote{max-width:1120px;margin-left:auto;margin-right:auto}
  .form-sec .form-card{max-width:none;margin:0}
}

</style>

const GAS_URL = "https://script.google.com/macros/s/AKfycbzGJADjQF3KEOunwLvTIk24OU9SwoeKz0JgAJ_OZGP-TI2CUltyUH0o6hLs-fL6a9Et3Q/exec";

// 실시간 신청현황 더미 데이터 (주택담보대출)
const surnames = ["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","전","홍"];
const conds = ["아파트 담보","빌라 담보","오피스텔 담보","직장인 신용대출","사업자 담보","후순위 담보","신용대출","대환 상담"];
const amounts = ["5,000만원","8,000만원","1억원","1.5억원","2억원","3억원"];
const states = [["승인완료","badge-ok"],["진행중","badge-go"],["조회완료","badge-ok"]];
function rand(a){return a[Math.floor(Math.random()*a.length)]}

let REAL_ROWS = [];  // 구글시트에서 불러온 실제 신청내역(마스킹된 상태)
function dummyRow(){
  return {
    nm: rand(surnames)+"*"+(Math.random()<.5?"*":rand(surnames)),
    type: rand(conds),
    amount: rand(amounts),
    st: rand(states)
  };
}
function pickRow(){
  if(REAL_ROWS.length && Math.random()<0.6){
    const r=REAL_ROWS[Math.floor(Math.random()*REAL_ROWS.length)];
    return { nm:r.nm, type:r.type||rand(conds), amount:r.amount||rand(amounts), st: rand(states) };
  }
  return dummyRow();
}
function rowHTML(rec,isNew){
  return `<div class="live-row${isNew?' isnew':''}">
    <div class="nm">${rec.nm}</div>
    <div>${rec.type}</div>
    <div>${rec.amount}</div>
    <div><span class="${rec.st[1]}">${rec.st[0]}</span></div>
  </div>`;
}
function buildRows(n){
  const box=document.getElementById("liveList");
  if(!box) return;
  let html="";
  for(let i=0;i<n;i++) html+=rowHTML(pickRow(),false);
  box.insertAdjacentHTML("beforeend",html);
}
// 실시간처럼 새 신청내역이 위에서 내려오며 아래로 슬라이딩
function addLiveRow(){
  const box=document.getElementById("liveList");
  if(!box) return;
  const head=box.querySelector(".live-row.head");
  if(!head) return;
  head.insertAdjacentHTML("afterend", rowHTML(pickRow(),true));
  const rows=box.querySelectorAll(".live-row:not(.head)");
  if(rows.length>8) rows[rows.length-1].remove();
}
function startLiveFeed(){
  const tick=function(){
    addLiveRow();
    setTimeout(tick, 2000+Math.random()*2600);
  };
  setTimeout(tick, 1800);
}
// 구글시트의 실제 신청내역(이름 마스킹)을 JSONP로 불러오기 (CORS 우회)
function loadRealRows(){
  if(!GAS_URL || GAS_URL.indexOf("http")!==0) return;
  const cb="__nsLive_"+Math.floor(Math.random()*1e9);
  window[cb]=function(rows){
    if(Array.isArray(rows) && rows.length) REAL_ROWS=rows;
    try{ delete window[cb]; }catch(e){}
  };
  const s=document.createElement("script");
  s.src=GAS_URL+"?list=1&callback="+cb;
  s.onerror=function(){ try{ delete window[cb]; }catch(e){} };
  document.head.appendChild(s);
}

const PAGE_LOADED_AT = Date.now();
function normPhone(v){ return (v||"").replace(/[^0-9]/g,""); }

async function submitForm(e){
  e.preventDefault();
  const f=e.target;

  // 스팸 방어 1: 허니팟(사람에겐 안 보이는 칸)이 채워졌으면 봇 → 조용히 성공처럼 종료
  if((f.website && f.website.value) || (f.homepage && f.homepage.value)){
    alert("한도조회 신청이 접수되었습니다.\n전문 상담원이 곧 연락드리겠습니다. 감사합니다!");
    f.reset(); return false;
  }
  // 스팸 방어 2: 페이지 로드 후 3초 이내 제출은 봇으로 간주
  if(Date.now() - PAGE_LOADED_AT < 3000){
    alert("입력을 조금만 더 확인한 뒤 다시 시도해주세요.");
    return false;
  }
  if(!f.agree.checked){alert("개인정보 수집·이용에 동의해주세요.");return false;}

  // 스팸 방어 3: 휴대폰 번호 형식 검증 (010/011… 10~11자리)
  const phone = normPhone(f.phone.value);
  if(!/^01[0-9]{8,9}$/.test(phone)){
    alert("휴대폰 번호를 정확히 입력해주세요. (예: 01012345678)");
    return false;
  }

  const btn=f.querySelector("button[type=submit]");
  const orig=btn.textContent;
  btn.disabled=true; btn.textContent="접수 중...";

  const data={
    name:f.name.value.trim(),
    phone:phone,
    property:(f.property && f.property.value)||"",
    amount:(f.amount && f.amount.value)||"",
    website:(f.website && f.website.value)||"",
    elapsed:Date.now()-PAGE_LOADED_AT,
    page:location.href,
    ua:navigator.userAgent
  };

  try{
    if(GAS_URL.startsWith("http")){
      await fetch(GAS_URL,{
        method:"POST",
        mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(data)
      });
    }
    alert("한도조회 신청이 접수되었습니다.\n전문 상담원이 곧 연락드리겠습니다. 감사합니다!");
    f.reset();
  }catch(err){
    alert("일시적인 오류가 발생했습니다. 전화(0000-0000)로 문의해주세요.");
  }finally{
    btn.disabled=false; btn.textContent=orig;
  }
  return false;
}

loadRealRows();
buildRows(8);
startLiveFeed();

// 수치 카운트업: .countup 요소가 화면에 들어오면 0 -> 목표값으로 상승
function animateCount(el){
  var raw = el.getAttribute("data-cv") || el.textContent;
  el.setAttribute("data-cv", raw);
  var m = raw.match(/[\d,]+(\.\d+)?/);
  if(!m) return;
  var numStr = m[0];
  var target = parseFloat(numStr.replace(/,/g,""));
  if(isNaN(target)) return;
  var decimals = numStr.indexOf(".")>=0 ? numStr.split(".")[1].length : 0;
  var hasComma = numStr.indexOf(",")>=0;
  var prefix = raw.slice(0, m.index);
  var suffix = raw.slice(m.index + numStr.length);
  function fmt(v){
    var s = v.toFixed(decimals);
    if(hasComma){ var p=s.split("."); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,","); s=p.join("."); }
    return prefix + s + suffix;
  }
  var dur=1300, startT=null;
  function step(ts){
    if(startT===null) startT=ts;
    var pr=Math.min((ts-startT)/dur,1);
    var e=1-Math.pow(1-pr,3);
    el.textContent=fmt(target*e);
    if(pr<1) requestAnimationFrame(step); else el.textContent=fmt(target);
  }
  el.textContent=fmt(0);
  requestAnimationFrame(step);
}
function initCountup(){
  var els=document.querySelectorAll(".countup");
  if(!els.length) return;
  if(!("IntersectionObserver" in window)){ for(var i=0;i<els.length;i++) animateCount(els[i]); return; }
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ animateCount(en.target); io.unobserve(en.target); } });
  },{threshold:.4});
  els.forEach(function(el){ io.observe(el); });
}
initCountup();

</script>
